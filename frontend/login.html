<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Campus Lost & Found</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p class="muted">Login to manage your campus reports</p>
      </div>

      <form id="login-form">
        <div class="form-grid">
          <div class="form-field full-width">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@campus.edu" required />
          </div>

          <div class="form-field full-width">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Login</button>
          <a class="btn btn-light" href="register.html">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');

    if (getStoredToken()) {
      window.location.href = 'my-reports.html';
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(loginForm);
      const payload = {
        email: formData.get('email'),
        password: formData.get('password'),
      };

      try {
        const response = await fetch(`${window.APP_CONFIG.API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        saveAuthData(data.token, data.user);
        showMessage('Login successful.', 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? 'admin.html' : 'my-reports.html';
        }, 700);
      } catch (error) {
        showMessage(error.message, 'error');
      }
    });
  </script>
</body>
</html>
