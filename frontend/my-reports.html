<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">Campus Lost & Found</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="report-lost.html">Report Lost</a>
        <a href="report-found.html">Report Found</a>
        <a href="my-reports.html">My Reports</a>
        <a href="my-claims.html">My Claims</a>
        <a href="admin.html" data-auth-link="dashboard">Admin</a>
      </div>
      <div class="nav-actions">
        <span class="muted" data-user-name>Guest</span>
        <button class="btn btn-light hidden" data-logout>Logout</button>
      </div>
    </div>
  </nav>

  <main class="container page-title">
    <h1>My Dashboard</h1>
    <div id="dashboard-message"></div>
    <div id="report-stats" class="dashboard-grid"></div>
    <div class="dashboard-shell" style="margin-top: 1.5rem;">
      <h2>My Reports</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Item</th>
              <th>Type</th>
              <th>Date</th>
              <th>Location</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="my-reports-table"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
